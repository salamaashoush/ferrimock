[package]
name = "ferrimock-napi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node.js NAPI bindings for the Ferrimock HTTP mocking engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI bindings (pinned, not workspace — independent versioning)
# Pinned below 3.11: napi 3.11+ requires a TypeTag impl that napi-derive 3.5.3
# does not emit, and napi-derive 3.6.x pulls napi-derive-backend 6.1.2, which
# generates references to `NativeBorrowScope` that no published napi exports.
# The macro crate is ahead of the runtime crate; lift this once they line up.
napi = { version = ">=3.8.4, <3.11", default-features = false, features = ["napi9", "tokio_rt", "async", "serde-json"] }
napi-derive = { version = ">=3.5.3, <3.6", default-features = false, features = ["type-def"] }

# Core ferrimock library. Everything except `scripting`: under Node the JS
# mock files run on V8 via ferrimock's loader — embedding QuickJS in
# the addon would double-load them on a slower engine.
ferrimock = { path = "../ferrimock", features = ["engine", "graphql", "server", "api", "schema"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde_json = { workspace = true }

# HTTP types
http = { workspace = true }

# Web framework (for the embedded mock server)
axum = { workspace = true }

# Utilities
bytes = { workspace = true }
urlencoding = { workspace = true }
rustc-hash = { workspace = true }
regex = { workspace = true }
smallvec = { workspace = true }

[build-dependencies]
napi-build = "2"

# Inherit workspace lints but allow napi-specific patterns
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# napi-derive generates code that triggers these
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
unused_async = "allow"
redundant_closure = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
