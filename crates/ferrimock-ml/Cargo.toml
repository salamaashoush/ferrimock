[package]
name = "ferrimock-ml"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Learned field-type classification for ferrimock's consolidation engine"

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["ndarray", "autodiff"] }
ferrimock = { version = "0.3.0", path = "../ferrimock", features = ["engine"] }
regex = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The CLI reads recordings through ferrimock, whose IO is async.
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
har = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
